[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucidlog"
version = "0.1.2"
description = "Source-aware exception diagnostics with conservative explanations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Malhar Pangarkar", email = "malharpangarkar19@gmail.com" }]
keywords = ["debugging", "exceptions", "diagnostics", "tracebacks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "build>=1.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Malhar1912/LucidLog"
Repository = "https://github.com/Malhar1912/LucidLog"
Issues = "https://github.com/Malhar1912/LucidLog/issues"
Changelog = "https://github.com/Malhar1912/LucidLog/blob/main/docs/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
